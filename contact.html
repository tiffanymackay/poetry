<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description"  content="A portfolio of Tiffany Mackay's poetry." />
    <link href="/styles/styles.css" rel="stylesheet">
    <link rel="shortcut icon" type="image/jpg" href="/images/favicon.png"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet"> 
    <script src="https://kit.fontawesome.com/40445c9f19.js" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-0evHe/X+R7YkIZDRvuzKMRqM+OrBnVFBL6DOitfPri4tjfHxaWutUpFmBp4vmVor" crossorigin="anonymous">
    <title>Tiffany Mackay's poetry website</title>
    <script src="/js/components.js"></script>
</head>
<body class="px-5">

  <header></header>
<hr>
<main class="pt-5">
      
    <h2 class="text-center pt-5 pb-2">Contact Me</h2>
    <form name="contact" method="POST" data-netlify="true" enctype="multipart/form-data">
      <input type="hidden" name="form-name" value="contact">
      <div class="mb-3">
        <label for="name" class="form-label">Name</label>
        <input type="text" class="form-control" id="name" name="name" required>
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Email address</label>
        <input type="email" class="form-control" id="email" name="email" required>
      </div>
      <div class="mb-3">
        <label for="message" class="form-label">Message</label>
        <textarea class="form-control" id="message" name="message" rows="3" required></textarea>
      </div>
      <div class="mb-3">
        <label for="file" class="form-label">File</label>
        <input type="file" class="form-control" id="file" name="file">
      </div>
      <button type="submit" class="btn btn-primary">Submit</button>
    </form>

      <div class="pt-4 pb-5 text-center">
        <a class="btn btn-primary px-4 pb-2" href="/poetry.html" role="button">View more poetry</a>
      </div>
      <button id="button" class="display-button"><i class="fas fa-arrow-up"></i></button>
<hr>

      <footer></footer>
    <script src="/js/script.js" type="text/javascript"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/js/bootstrap.bundle.min.js" integrity="sha384-pprn3073KE6tl6bjs2QrFaJGz5/SUsLqktiwsUTF55Jfv3qYSDhgCecCxMW52nD2" crossorigin="anonymous"></script>
  </body>
</html>
